# docker-compose.yml (also works with podman-compose)
#
# CAMERA_DEVICE can be a local V4L2 device OR a URL:
#
# Usage:
#   # Local USB / V4L2 camera
#   export CAMERA_DEVICE=/dev/video0
#   podman-compose up -d --build
#
#   # RTSP network camera (no --device flag needed)
#   export CAMERA_DEVICE=rtsp://user:pass@192.168.1.50/stream1
#   podman-compose up -d --build
#
# Or set variables in a .env file next to this file.
#
# Requires:  podman-compose  (pip install podman-compose)
#            OR  docker compose  (works identically)

version: "3.9"

services:
  detector:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        # Run `cat /etc/nv_tegra_release` on the Jetson to find your JetPack.
        # JetPack 6.0   → r36.2.0-cu122-torch2.2-ubuntu22.04
        # JetPack 5.1.2 → r35.3.1-cu114-torch2.1-ubuntu20.04
        JETPACK_TAG: "${JETPACK_TAG:-2.7-r36.4.0-cu128-24.04}"
    image: rtsp-detector:latest
    container_name: rtsp-detector
    restart: unless-stopped

    # ── privileged mode for Jetson GPU access ────────────────────────────────
    # The Jetson Orin's GPU is an integrated SoC – passing individual device
    # nodes is unreliable across JetPack versions.  privileged gives the
    # container the same device access as the host, which is required for CUDA.
    privileged: true
    user: root

    # Pass the device node to the container only for local V4L2 devices.
    # When CAMERA_DEVICE is a URL (rtsp://, http://, etc.) this entry is ignored
    # at runtime by the container runtime (the path won't exist on the host).
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}"

    # ── network ──────────────────────────────────────────────────────────────
    network_mode: host

    # ── shared memory ────────────────────────────────────────────────────────
    shm_size: "512m"

    # ── CUDA / Jetson library bind-mounts (RHEL/aarch64) ─────────────────────
    # On this RHEL Jetson host libcuda.so lives in /usr/lib64/nvidia and /lib64.
    # Mount only the nvidia directory — do NOT mount /lib64 wholesale as it
    # would overwrite the container's glibc with the host's older version.
    volumes:
      - ./models:/models:z
      - /usr/lib64/nvidia:/usr/lib64/nvidia:ro

    # ── environment ──────────────────────────────────────────────────────────
    environment:
      # Input source: a local V4L2 device (e.g. /dev/video0) OR a URL
      # (rtsp://, rtsps://, rtmp://, http://, https://)
      # CAMERA_WIDTH / HEIGHT / FPS are used only for local devices.
      CAMERA_DEVICE:  "${CAMERA_DEVICE:-/dev/video0}"
      CAMERA_WIDTH:   "${CAMERA_WIDTH:-640}"
      CAMERA_HEIGHT:  "${CAMERA_HEIGHT:-480}"
      CAMERA_FPS:     "${CAMERA_FPS:-30}"

      # Detection tuning
      CONFIDENCE:     "${CONFIDENCE:-0.40}"
      MODEL_SIZE:     "${MODEL_SIZE:-n}"
      USE_TENSORRT:   "${USE_TENSORRT:-0}"

      # Output: RTSP server
      RTSP_OUT_PORT:  "${RTSP_OUT_PORT:-8554}"
      RTSP_OUT_PATH:  "${RTSP_OUT_PATH:-/live}"

      # Web preview
      WEB_PORT:       "${WEB_PORT:-8080}"

      # GStreamer verbosity (set GST_DEBUG=3 in your shell for more detail)
      GST_DEBUG:      "${GST_DEBUG:-1}"

      # Make the bind-mounted host CUDA libs findable by the dynamic linker
      LD_LIBRARY_PATH: "/usr/lib64/nvidia:"
